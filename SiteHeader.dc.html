<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<style>
.mx-burger{display:none}
#mx-nav-toggle{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
@media (max-width:900px){
  .mx-topbar{padding:7px 16px !important;font-size:13px !important;justify-content:center !important}
  .mx-topbar .mx-loc{display:none !important}
  .mx-topbar .mx-contact{gap:18px !important;justify-content:center}
  .mx-bar{padding:6px 16px !important;flex-wrap:nowrap !important}
  .mx-logo img{height:48px !important}
  .mx-burger{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;cursor:pointer;color:#0B1F45;font-family:'Material Symbols Outlined';font-size:30px;user-select:none;-webkit-tap-highlight-color:transparent}
  .mx-burger .mx-close{display:none}
  .mx-nav{display:none !important;position:absolute;left:0;right:0;top:100%;background:#FFFFFF;flex-direction:column;align-items:stretch !important;gap:0 !important;padding:4px 0 8px;border-bottom:1px solid #E6DFD0;box-shadow:0 14px 24px rgba(11,31,69,0.12)}
  .mx-nav a{padding:14px 20px !important;border-bottom:1px solid #F0EBE0 !important;border-left:3px solid transparent}
  .mx-nav a[data-active="1"]{border-left-color:#C39549}
  #mx-nav-toggle:checked ~ .mx-nav{display:flex !important}
  #mx-nav-toggle:checked ~ .mx-burger .mx-open{display:none}
  #mx-nav-toggle:checked ~ .mx-burger .mx-close{display:inline}
}
</style>
<header style="width:100%;font-family:'Hanken Grotesk',system-ui,sans-serif">
  <div style="background:#071634;color:#C9D2E3;font-size:14px">
    <div class="mx-topbar" style="max-width:1280px;margin:0 auto;padding:9px 28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <span class="mx-loc" style="display:flex;align-items:center;gap:8px"><span style="font-family:'Material Symbols Outlined';font-size:18px;color:#D4AE6A">location_on</span>Suez Canal &amp; Egyptian Ports</span>
      <div class="mx-contact" style="display:flex;align-items:center;gap:28px;flex-wrap:wrap">
        <a href="tel:+20663204265" style="display:flex;align-items:center;gap:8px;color:#FFFFFF;font-weight:600" style-hover="color:#D4AE6A"><span style="font-family:'Material Symbols Outlined';font-size:18px;color:#D4AE6A">call</span>+20 66 320 4265</a>
        <!--email_off--><a href="mailto:info@marvex-marine.com" style="display:flex;align-items:center;gap:8px;color:#FFFFFF;font-weight:600" style-hover="color:#D4AE6A"><span style="font-family:'Material Symbols Outlined';font-size:18px;color:#D4AE6A">mail</span>info@marvex-marine.com</a><!--/email_off-->
      </div>
    </div>
  </div>
  <div style="background:#FFFFFF;border-bottom:1px solid #E6DFD0;box-shadow:0 6px 24px rgba(11,31,69,0.06)">
    <div class="mx-bar" style="position:relative;max-width:1280px;margin:0 auto;padding:8px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
      <a class="mx-logo" href="/" style="display:flex;align-items:center"><img src="/assets/marvex-logo.jpeg" alt="Marvex Marine" style="height:64px;width:auto;display:block"></a>
      <input type="checkbox" id="mx-nav-toggle" aria-label="Toggle menu">
      <label for="mx-nav-toggle" class="mx-burger" aria-label="Menu"><span class="mx-open">menu</span><span class="mx-close">close</span></label>
      <nav class="mx-nav" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" data-active="{{ l.act }}" style="padding:14px 16px;font-size:16px;font-weight:600;color:{{ l.color }};border-bottom:2px solid {{ l.line }}" style-hover="color:#8A6424">{{ l.label }}</a>
        </sc-for>
      </nav>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:130},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;services&quot;,&quot;area&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const links = [
      ['home', 'Home', '/'],
      ['about', 'About Us', '/about'],
      ['services', 'Our Services', '/services'],
      ['area', 'Service Area', '/service-area'],
      ['contact', 'Contact Us', '/contact']
    ].map(([k, label, href]) => ({ label, href, color: k === active ? '#0B1F45' : '#3A4A66', line: k === active ? '#C39549' : 'transparent', act: k === active ? '1' : '0' }));
    return { links };
  }
}
</script>
</body>
</html>
